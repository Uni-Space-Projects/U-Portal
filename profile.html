<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-bank - Perfil</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">
</head>
<body>

<nav class="navbar">
    <a href="dashboard.html" class="logo">U-bank</a>
    <div class="nav-actions">
        <a href="dashboard.html">Volver</a>
        <button id="themeToggle" class="btn-icon" title="Cambiar tema">🌙</button>
    </div>
</nav>

<div class="main-container">
    <div class="card">
        <h2 style="margin-bottom: 20px;">Mi Perfil</h2>
        
        <form id="profileForm">
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" class="input-control" id="profName" value="Usuario Demo" required>
            </div>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" class="input-control" id="profEmail" value="usuario@demo.com" required>
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="tel" class="input-control" id="profPhone" value="0414-1234567">
            </div>
            
            <button type="submit" class="btn">Guardar Cambios</button>
        </form>
    </div>

    <div class="card">
        <h2 style="margin-bottom: 20px;">Seguridad</h2>
        <form id="passwordForm">
            <div class="form-group">
                <label>Contraseña Actual</label>
                <input type="password" class="input-control" required>
            </div>
            <div class="form-group">
                <label>Nueva Contraseña (mín. 6 números)</label>
                <input type="password" class="input-control" id="newPass" required>
            </div>
            <div class="form-group">
                <label>Confirmar Nueva Contraseña</label>
                <input type="password" class="input-control" id="newPassConfirm" required>
            </div>
            <button type="submit" class="btn btn-secondary">Cambiar Contraseña</button>
        </form>
    </div>
</div>

<script src="./js/theme.js"></script>
<script src="./js/profile.js"></script>

</body>
</html>
